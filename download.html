<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Image Collector - Building ZIP</title>
<link rel="stylesheet" href="popup.css">
<style>
  body { width: auto; max-width: 560px; margin: 40px auto; padding: 24px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 16px 0; }
  .bar div { height: 100%; width: 0; background: var(--blue); transition: width .15s; }
  #status { font-size: 14px; }
  #done { display: none; margin-top: 16px; }
  #done a { color: var(--blue); font-weight: 600; }
</style>
</head>
<body>
  <header><img src="icons/on48.png" alt="" width="28" height="28"><h1>Building your ZIP</h1></header>
  <div id="status">Starting…</div>
  <div class="bar"><div id="bar"></div></div>
  <div id="detail" class="hint"></div>
  <div id="done"></div>
  <script src="zip.js"></script>
  <script src="download.js"></script>
</body>
</html>
