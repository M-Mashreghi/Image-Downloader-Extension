<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/on48.png" alt="" width="28" height="28">
    <h1>Image Collector</h1>
  </header>

  <label class="toggle">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
    <span id="stateText">OFF</span>
  </label>

  <div class="count"><span id="count">0</span> images collected</div>
  <p class="hint" id="hint">Turn it on, then browse. Every image you see is added.</p>

  <label class="opt"><input type="checkbox" id="siteOnly"> <span>Only from this website<b id="siteName"></b></span></label>
  <label class="opt"><input type="checkbox" id="skipSmall"> Skip tiny images (under 50×50 px)</label>

  <div class="auto">
    <button id="autoBtn">⬇ Auto-scroll</button>
    <select id="speed" title="Scroll speed">
      <option value="slow">Slow</option>
      <option value="normal" selected>Normal</option>
      <option value="fast">Fast</option>
    </select>
  </div>
  <label class="opt"><input type="checkbox" id="autoFinish"> <span>When it reaches the end: download the ZIP after 5 s, then close the page</span></label>
  <p class="hint" id="autoHint">Scrolls the page down by itself so every image loads.</p>

  <div class="buttons">
    <button id="download" class="primary">Download ZIP</button>
    <button id="clear">Clear</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
